{{ define "nav" -}}
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/">{{ T . "app.title" }}</a>
        <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse" data-bs-target="#navMain"
                aria-controls="navMain" aria-expanded="false"
                aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navMain">
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link {{ if eq .Page "dashboard" }}active{{ end }}"
                       href="/">{{ T . "nav.dashboard" }}</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {{ if eq .Page "compose" }}active{{ end }}"
                       href="/compose">{{ T . "nav.compose" }}</a>
                </li>
            </ul>
            <ul class="navbar-nav">
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" href="#" role="button"
                       data-bs-toggle="dropdown" aria-expanded="false">
                        {{ T . "nav.lang" }}: {{ .Lang }}
                    </a>
                    <ul class="dropdown-menu dropdown-menu-end">
                        {{ range .SupportedLangs }}
                        <li>
                            <a class="dropdown-item {{ if eq . $.Lang }}active{{ end }}"
                               href="/lang/{{ . }}">{{ . }}</a>
                        </li>
                        {{ end }}
                    </ul>
                </li>
            </ul>
        </div>
    </div>
</nav>
{{- end }}
