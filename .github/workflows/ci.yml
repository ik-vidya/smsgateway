name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true

      - name: go mod download
        run: go mod download

      - name: gofmt
        run: |
          UNFORMATTED=$(gofmt -l cmd/ internal/ || true)
          if [ -n "$UNFORMATTED" ]; then
            echo "::error::gofmt found unformatted files:"
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: vendor assets check
        run: |
          missing=0
          for f in \
            internal/webui/static/vendor/bootstrap/bootstrap.min.css \
            internal/webui/static/vendor/bootstrap/bootstrap.bundle.min.js \
            internal/webui/static/vendor/htmx/htmx.min.js; do
            if [ ! -s "$f" ]; then
              echo "::warning::missing or empty: $f"
              missing=1
            fi
          done
          if [ "$missing" = "1" ]; then
            echo "Vendor assets missing, fetching..."
            make fetch
          fi

      - name: go test
        run: go test ./... -timeout 60s

      - name: go test -race (parallel packages)
        run: |
          go test -race -timeout 120s \
            ./internal/logging/... \
            ./internal/webui/... \
            ./internal/api/... \
            ./internal/modem/... \
            ./internal/service/... \
            ./internal/storage/...

      - name: build (no CGO)
        run: CGO_ENABLED=0 go build ./...

      - name: cross-compile
        run: |
          mkdir -p /tmp/out
          CGO_ENABLED=0 GOOS=linux   GOARCH=amd64 go build -o /tmp/out/smsgateway-linux-amd64       ./cmd/smsgateway
          CGO_ENABLED=0 GOOS=linux   GOARCH=arm64 go build -o /tmp/out/smsgateway-linux-arm64       ./cmd/smsgateway
          CGO_ENABLED=0 GOOS=linux   GOARCH=arm   GOARM=7 go build -o /tmp/out/smsgateway-linux-armv7 ./cmd/smsgateway
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -o /tmp/out/smsgateway-windows-amd64.exe ./cmd/smsgateway
          ls -la /tmp/out
